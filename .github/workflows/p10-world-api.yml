name: P10 headless world CPU contracts
on:
  push:
    branches:
      - p10-headless-world-api-20261031
  pull_request:
    paths:
      - 'sunder_world.py'
      - 'test_sunder_world.py'
      - 'test_p10_packaging.py'
      - 'test_native_world.py'
      - 'package_p10_evidence.py'
      - 'physics3.c'
      - 'physics3.h'
      - 'headless_demo.py'
      - 'run_world_sweep.py'
      - '.github/workflows/p10-world-api.yml'
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Verify headless world host contracts (no GPU physics qualification)
        run: python -m unittest test_sunder_world test_p10_packaging -v
